<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-9px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.06); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -120; }
      }
      @keyframes waveLine {
        0% { transform: scaleY(1); }
        50% { transform: scaleY(1.06) translateY(-4px); }
        100% { transform: scaleY(1); }
      }
      .floating-card-1 { animation: floatSlow 4s ease-in-out infinite; }
      .floating-card-2 { animation: floatFast 3.2s ease-in-out infinite 0.8s; }
      .floating-card-3 { animation: floatSlow 4.8s ease-in-out infinite 0.4s; }
      .pulsing-glow { animation: pulseGlow 3.5s ease-in-out infinite; transform-origin: center; }
      .chart-wave { animation: waveLine 4s ease-in-out infinite; transform-origin: bottom; }
      .animated-dash { stroke-dasharray: 8 6; animation: dashMove 8s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)" rx="16" />

  <!-- Background Grid -->
  <g opacity="0.1">
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="160" x2="1200" y2="160" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="320" x2="1200" y2="320" stroke="#38bdf8" stroke-width="1" />
    <line x1="150" y1="0" x2="150" y2="400" stroke="#38bdf8" stroke-width="1" />
    <line x1="300" y1="0" x2="300" y2="400" stroke="#38bdf8" stroke-width="1" />
    <line x1="450" y1="0" x2="450" y2="400" stroke="#38bdf8" stroke-width="1" />
    <line x1="600" y1="0" x2="600" y2="400" stroke="#38bdf8" stroke-width="1" />
    <line x1="750" y1="0" x2="750" y2="400" stroke="#38bdf8" stroke-width="1" />
    <line x1="900" y1="0" x2="900" y2="400" stroke="#38bdf8" stroke-width="1" />
    <line x1="1050" y1="0" x2="1050" y2="400" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Glowing Orbs -->
  <circle cx="180" cy="110" r="160" fill="#0ea5e9" opacity="0.14" filter="url(#glow)" class="pulsing-glow" />
  <circle cx="980" cy="270" r="210" fill="#10b981" opacity="0.12" filter="url(#glow)" class="pulsing-glow" />
  <circle cx="620" cy="190" r="140" fill="#6366f1" opacity="0.1" filter="url(#glow)" />

  <!-- Animated Chart Curve in Background -->
  <g class="chart-wave" opacity="0.65">
    <path d="M 0 350 Q 220 270, 440 300 T 880 200 T 1200 160 L 1200 400 L 0 400 Z" fill="url(#chartGrad)" />
    <path d="M 0 350 Q 220 270, 440 300 T 880 200 T 1200 160" fill="none" stroke="#10b981" stroke-width="3.5" filter="url(#softGlow)" />
    <path d="M 0 320 Q 280 370, 520 240 T 960 150 T 1200 120" fill="none" stroke="#38bdf8" stroke-width="2.2" class="animated-dash" />
  </g>

  <!-- Left Header Content -->
  <g transform="translate(70, 60)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="310" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#10b981" />
    <text x="32" y="21" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURATED RETAIL PRICING ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">
      Retail Price Optimization
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Enterprise SaaS Platforms • Elasticity ML • Dynamic Repricing Engines
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 155)">
      <g transform="translate(0, 0)">
        <rect width="135" height="28" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
        <text x="12" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🏷️ Dynamic Pricing</text>
      </g>
      <g transform="translate(145, 0)">
        <rect width="145" height="28" rx="8" fill="#1e293b" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
        <text x="12" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📈 Margin Yield +18%</text>
      </g>
      <g transform="translate(300, 0)">
        <rect width="150" height="28" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1" />
        <text x="12" y="18" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🤖 Causal Elasticity</text>
      </g>
      <g transform="translate(460, 0)">
        <rect width="140" height="28" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1" />
        <text x="12" y="18" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Real-time Repricing</text>
      </g>
    </g>
  </g>

  <!-- Right Floating Metric Cards -->
  <g transform="translate(730, 45)">
    <!-- Card 1: SKU Recommendation -->
    <g class="floating-card-1" transform="translate(40, 20)">
      <rect width="360" height="92" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#softGlow)" />
      <circle cx="34" cy="38" r="16" fill="#10b981" fill-opacity="0.18" />
      <text x="26" y="44" fill="#34d399" font-size="18">💎</text>
      <text x="64" y="34" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">AI Price Recommendation</text>
      <text x="64" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">SKU #84920 · Base: $34.50 ➔ Opt: $39.99</text>
      <rect x="64" y="62" width="96" height="18" rx="9" fill="#065f46" fill-opacity="0.6" />
      <text x="74" y="75" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">+15.9% MARGIN</text>
      <text x="270" y="75" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">99.4% Conf</text>
    </g>

    <!-- Card 2: Causal Elasticity Model -->
    <g class="floating-card-2" transform="translate(0, 130)">
      <rect width="380" height="92" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" filter="url(#softGlow)" />
      <circle cx="34" cy="38" r="16" fill="#38bdf8" fill-opacity="0.18" />
      <text x="26" y="44" fill="#38bdf8" font-size="18">⚡</text>
      <text x="64" y="34" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Cross-Elasticity Modeling</text>
      <text x="64" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Double ML / Demand Sensitivity ε = -1.42</text>
      <rect x="64" y="62" width="112" height="18" rx="9" fill="#0369a1" fill-opacity="0.5" />
      <text x="74" y="75" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">SUBSTITUTE SAFE</text>
      <text x="240" y="75" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">4.2M Products</text>
    </g>

    <!-- Card 3: Real-Time Price Engine Stream -->
    <g class="floating-card-3" transform="translate(60, 240)">
      <rect width="340" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <circle cx="30" cy="37" r="14" fill="#a78bfa" fill-opacity="0.2" />
      <text x="22" y="43" fill="#c084fc" font-size="16">🚀</text>
      <text x="56" y="33" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Omnichannel Execution</text>
      <text x="56" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Automated Repricing across 28 Competitors</text>
      <text x="250" y="52" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">● Live Sync</text>
    </g>
  </g>
</svg>
